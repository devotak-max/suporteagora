services:
  db:
    image: postgres:16-alpine
    container_name: itsm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - itsm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm} -d ${POSTGRES_DB:-itsm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Banco não exposto à internet em produção; descomente para acesso externo controlado
    # ports:
    #   - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: suporteagora/backend:latest
    container_name: itsm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-itsm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itsm}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itsm-net
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Backend não fica exposto: o nginx do frontend faz o proxy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    image: suporteagora/frontend:latest
    container_name: itsm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - itsm-net
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
    driver: local
  backend_logs:
    driver: local

networks:
  itsm-net:
    driver: bridge
